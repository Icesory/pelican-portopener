name: portopener-live
services:
  port-opener-service:
    container_name: PortOpenerService
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./service.json:/config/service.json:ro
      - ./credentials:/credentials
      - service-state:/state
    command: [python, /app/port_opener.py, run, --config, /config/service.json]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  service-state:
